name: Format UX polish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: format-ux-polish-branch
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/bright-news-guardrails'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/bright-news-guardrails

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format source
        run: npm run format

      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/'(app)'/article/'[id]'/page.tsx src/app/'(app)'/browse/page.tsx src/app/'(app)'/settings/page.tsx src/components/category/CategoryCard.tsx src/components/onboarding/OnboardingCarousel.tsx
          git commit -m "style: format UX polish"
          git push origin HEAD:agent/bright-news-guardrails
