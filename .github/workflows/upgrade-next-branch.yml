name: Upgrade secure Next.js baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: upgrade-next-commercial-branch
  cancel-in-progress: true

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/bright-news-guardrails'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/bright-news-guardrails

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install secure Next.js baseline
        run: npm install --save-exact next@15.5.21 eslint-config-next@15.5.21

      - name: Run full quality checks
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit dependency lock update
        run: |
          if git diff --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade Next.js security baseline"
          git push origin HEAD:agent/bright-news-guardrails
