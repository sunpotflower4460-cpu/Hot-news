name: Upgrade secure Next.js baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: upgrade-next-commercial-branch
  cancel-in-progress: true

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/bright-news-guardrails'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/bright-news-guardrails

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install secure Next.js and React baseline
        run: |
          npm install --save-exact next@16.2.12 react@19.2.0 react-dom@19.2.0
          npm install --save-dev --save-exact eslint@9.39.2 eslint-config-next@16.2.12 @types/react@19.2.2 @types/react-dom@19.2.2 postcss@8.5.22
          npm pkg set 'overrides.postcss=$postcss' overrides.sharp=0.35.3
          npm install

      - name: Migrate next lint to ESLint CLI
        run: npx --yes @next/codemod@canary next-lint-to-eslint-cli . --force

      - name: Format migration changes
        run: npm run format

      - name: Run full quality checks
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified dependency migration
        run: |
          if git diff --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: migrate to secure Next.js 16 baseline"
          git push origin HEAD:agent/bright-news-guardrails
