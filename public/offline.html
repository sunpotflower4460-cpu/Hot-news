<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf2" />
    <title>オフライン｜明るいニュース</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          'Hiragino Sans',
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #40352f;
        background:
          radial-gradient(circle at 50% 20%, #fff1cf, transparent 34%),
          linear-gradient(180deg, #fffaf2, #eefafa);
      }
      main {
        width: min(100%, 390px);
        padding: 40px 28px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 24px 70px -38px rgba(80, 65, 45, 0.38);
        backdrop-filter: blur(20px);
      }
      .sun {
        width: 92px;
        height: 92px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        font-size: 44px;
        background: rgba(255, 221, 157, 0.62);
        box-shadow:
          inset 0 1px 0 white,
          0 0 42px rgba(247, 160, 114, 0.24);
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.5;
      }
      p {
        margin: 12px auto 0;
        max-width: 290px;
        color: #756a63;
        font-size: 15px;
        line-height: 1.85;
      }
      button {
        width: 100%;
        min-height: 52px;
        margin-top: 26px;
        border: 0;
        border-radius: 999px;
        color: white;
        font: inherit;
        font-weight: 700;
        background: #ed9871;
        box-shadow: 0 12px 30px -15px rgba(237, 152, 113, 0.8);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="sun" aria-hidden="true">☀️</div>
      <h1>いまはネットにつながっていません</h1>
      <p>
        接続が戻ったら、もう一度ひらいてください。すでに表示したページは、端末に残っていれば読めることがあります。
      </p>
      <button type="button" onclick="location.reload()">もう一度つなぐ</button>
    </main>
  </body>
</html>
