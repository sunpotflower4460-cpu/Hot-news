name: Commercial release readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Validate commercial release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMERCIAL_RELEASE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate commercial blockers
        run: npm run commercial:check

      - name: Run full quality checks
        run: npm run format:check && npm run typecheck && npm run lint && npm run build
