name: Fix development dependency audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fix-dev-audit-commercial-branch
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/bright-news-guardrails'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/bright-news-guardrails

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking audit fix
        run: npm audit fix

      - name: Format any manifest changes
        run: npm run format

      - name: Run full quality checks
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit complete dependency tree
        run: npm audit --audit-level=high

      - name: Commit only verified lock changes
        run: |
          if git diff --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: resolve development dependency audit"
          git push origin HEAD:agent/bright-news-guardrails
